# Derived from docs/features/pet/data-model.md (entities/columns), sad.md §6 (sequence alt-branches),
# spec.md §4/§5 (endpoints, acceptance criteria). Never hand-typed beyond that derivation.
#
# Deviations from the sdd:api skill's fixed defaults — confirmed with the user (api-sync-report.md §Deviations):
#   - Offset pagination (?page/pageSize -> {data, totalCount}), not cursor — matches the repo's
#     ListFilterService, already used by GET /api/users/list and named in sad.md §8.
#   - No /v1 segment — matches main.ts `setGlobalPrefix('api')`; no versioning exists anywhere in this app.
#   - Error envelope {message, statusCode, timestamp, path}, not {code, message, details?} — matches the
#     actual global DatabaseExceptionFilter output; no `code` field exists in this app today.
openapi: 3.1.0

info:
  title: Pet API
  version: 0.1.0
  description: |
    Finishes the half-built pet module of the pet-connect API so an Authenticated user can
    register a pet and co-manage it with the people who care for it. Reads are open to any
    Authenticated user (read-all); writes (update, delete, membership changes) are restricted
    to a pet's Co-owners (write-members), enforced on every write path with no framework backstop.

servers:
  - url: http://localhost:3000
    description: Local

security:
  - BearerAuth: []

tags:
  - name: Pets
    description: Pet CRUD (register, view, list, update, remove)
  - name: Co-owners
    description: Per-pet Membership management (view, add, remove co-owners)

paths:
  /api/pets:
    post:
      summary: Register a pet
      tags: [Pets]
      description: US-01. The creating user becomes the pet's first Co-owner.
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PetCreate" }
            example:
              name: "Test Pet"
              dateOfBirth: "2020-01-01"
              typeId: 1
      responses:
        "201":
          description: Pet created — does not embed the co-owner list (AC-01)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
              example:
                id: 1
                name: "Test Pet"
                dateOfBirth: "2020-01-01"
                type: { id: 1, code: "dog", label: "Dog" }
        "400":
          description: Invalid name/date of birth (AC-02), or the referenced pet type does not exist (AC-03)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                message: "name must not be empty"
                statusCode: 400
                timestamp: "2026-07-21T00:00:00.000Z"
                path: "/api/pets"

  /api/pets/list:
    get:
      summary: Browse pets
      tags: [Pets]
      description: US-03. Bounded pages, stable default ordering by id — mirrors GET /api/users/list.
      operationId: listPets
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: searchTerm
          schema: { type: string }
      responses:
        "200":
          description: A page of pets — never includes any co-owner's credentials (AC-05)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PetPage" }

  /api/pets/{id}:
    get:
      summary: View a pet
      tags: [Pets]
      description: US-02.
      operationId: getPetById
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Name, date of birth, and pet type — does not embed the co-owner list (AC-04)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      summary: Update a pet (full replace)
      tags: [Pets]
      description: US-04. All three fields required on every update — not a partial patch (AC-06b).
      operationId: updatePet
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PetCreate" }
      responses:
        "200":
          description: Updated pet — does not embed the co-owner list (AC-06b)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "400":
          description: Invalid name/date of birth (AC-02), or the referenced pet type does not exist (AC-03)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is not a Co-owner — pet unchanged (AC-06)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Remove a pet
      tags: [Pets]
      description: US-05. Hard delete; clears the pet's Membership links (ON DELETE CASCADE on user_pets).
      operationId: deletePet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Pet removed for all Co-owners (AC-07b)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteConfirmation" }
        "403":
          description: Caller is not a Co-owner — pet remains (AC-07)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pets/{id}/co-owners:
    get:
      summary: View a pet's co-owners
      tags: [Co-owners]
      description: US-06. Minimal identity only — never a Co-owner's password/credentials (AC-08).
      operationId: listPetCoOwners
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: The pet's current Co-owners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoOwnerList" }
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      summary: Add a co-owner
      tags: [Co-owners]
      description: US-07. Idempotent — adding an existing Co-owner is a no-op success (AC-09c).
      operationId: addPetCoOwner
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCoOwner" }
            example:
              userId: 2
      responses:
        "200":
          description: Membership extended (AC-09b), or left unchanged if already a member (AC-09c)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoOwnerList" }
        "400":
          description: "# unresolved — target userId does not reference an existing user; no AC/sequence branch covers this case (see api-sync-report.md OQ-1)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is not a Co-owner — Membership unchanged (AC-09)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pets/{id}/co-owners/{userId}:
    delete:
      summary: Remove a co-owner
      tags: [Co-owners]
      description: US-08. Covers removing another Co-owner (AC-11) and self-removal / leave (AC-11c).
      operationId: removePetCoOwner
      parameters:
        - $ref: "#/components/parameters/PetId"
        - in: path
          name: userId
          required: true
          description: the Co-owner being removed
          schema: { type: integer }
      responses:
        "200":
          description: Membership updated to exclude the target (AC-11, AC-11c)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoOwnerList" }
        "403":
          description: Caller is not a Co-owner — Membership unchanged (AC-09 pattern, applied to removal per ADR-0001)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Pet does not exist (AC-12), or target user is not a Co-owner of the pet (AC-11b)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Removing the target would leave zero Co-owners — the no-orphan invariant (AC-10, AC-10b)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PetId:
      in: path
      name: id
      required: true
      schema: { type: integer }

  responses:
    NotFound:
      description: No such pet exists — the same not-found outcome for reads and writes (AC-12)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # Repo's actual error shape (DatabaseExceptionFilter) — a deliberate deviation from the skill's
    # {code, message, details?} default; see api-sync-report.md §Deviations.
    Error:
      type: object
      required: [message, statusCode]
      properties:
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        statusCode: { type: integer }
        timestamp: { type: string, format: date-time }
        path: { type: string }

    PetType:
      type: object
      required: [id, code, label]
      additionalProperties: false
      properties:
        id: { type: integer }
        code: { type: string }
        label: { type: string }

    Pet:
      type: object
      required: [id, name, dateOfBirth, type]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 255 }
        dateOfBirth: { type: string, format: date }
        type: { $ref: "#/components/schemas/PetType" }

    PetCreate:
      type: object
      required: [name, dateOfBirth, typeId]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: trimmed non-empty, within max length (AC-01/AC-02)
        dateOfBirth:
          type: string
          format: date
          description: must not be later than today, server UTC date (AC-01/AC-02)
        typeId:
          type: integer
          description: must reference an existing pet type (AC-03)

    PetPage:
      type: object
      required: [data, totalCount]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Pet" }
        totalCount: { type: integer }

    DeleteConfirmation:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: integer }

    # Minimal identity only — name + id, never credentials (sad.md §8, spec §6.1). Email
    # deliberately excluded pending the spec §8 open question ("email or name+id only").
    CoOwner:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    CoOwnerList:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CoOwner" }

    AddCoOwner:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          type: integer
          description: "# unresolved — id of an existing user to add as Co-owner (see api-sync-report.md OQ-1)"
