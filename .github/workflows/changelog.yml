name: Update Changelog

on:
  push:
    branches: [master]
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-changelog:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Get diff
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr diff "$PR_NUMBER" > entry.diff
          else
            git diff "${{ github.event.before }}" "${{ github.event.after }}" > entry.diff
          fi
          {
            echo 'diff<<PRDIFF_EOF'
            cat entry.diff
            echo 'PRDIFF_EOF'
          } >> "$GITHUB_ENV"

      - name: Generate release notes and update CHANGELOG.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENTRY_ID: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.after }}
          ENTRY_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
          ENTRY_BODY: ${{ github.event.pull_request.body }}
          ENTRY_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || github.event.head_commit.url }}
          ENTRY_AUTHOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || github.event.head_commit.author.username || github.event.head_commit.author.name }}
          ENTRY_KIND: ${{ github.event_name == 'pull_request' && 'pr' || 'commit' }}
          ENTRY_DIFF: ${{ env.diff }}
        run: .github/scripts/generate-changelog.sh

      - name: Commit and push
        env:
          ENTRY_ID: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.after }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update changelog for ${ENTRY_ID}"
            git push origin HEAD:master
          fi
